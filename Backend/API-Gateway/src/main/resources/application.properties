spring.application.name=API-GATEWAY
server.port=8087

# =============================================
# Configuration du client Eureka
# =============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# =============================================
# Découverte dynamique des microservices
# =============================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# =============================================
# Routes avec Circuit Breaker (Restaurant-Service)
# =============================================
spring.cloud.gateway.routes[0].id=restaurant-service
spring.cloud.gateway.routes[0].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/restaurants/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=restaurantCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/restaurants

# =============================================
# Routes vers les autres microservices
# =============================================
spring.cloud.gateway.routes[1].id=commande-service
spring.cloud.gateway.routes[1].uri=lb://COMMANDE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/commandes/**

spring.cloud.gateway.routes[2].id=menu-service
spring.cloud.gateway.routes[2].uri=lb://MENU-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/menus/**

spring.cloud.gateway.routes[3].id=livraison-service
spring.cloud.gateway.routes[3].uri=lb://LIVRAISON-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/livraisons/**,/livreurs/**

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**

# =============================================
# Configuration Resilience4j Circuit Breaker
# =============================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true

resilience4j.circuitbreaker.instances.restaurantCircuitBreaker.base-config=default

# =============================================
# Configuration Resilience4j TimeLimiter
# =============================================
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.instances.restaurantCircuitBreaker.base-config=default

# =============================================
# Actuator - Exposition des endpoints
# =============================================
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,gateway
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always

# Logging pour le debug
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.io.github.resilience4j=DEBUG
